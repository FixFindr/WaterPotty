# A string used to distinguish different Supabase projects on the same host.
project_id = "water-potty"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 17

[studio]
enabled = true
port = 54323

[inbucket]
enabled = true
port = 54324

[storage]
enabled = true
file_size_limit = "50MiB"

[auth]
enabled = true
# Expo dev server URL — update when deploying to production
site_url = "http://localhost:8081"
# Allow OAuth redirects back to the Expo deep link scheme and the Expo Go dev URL
additional_redirect_urls = [
  "waterpotty://",
  "waterpotty://login",
  "exp://localhost:8081"
]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10

[auth.email]
enable_signup = true
double_confirm_changes = true
# Set to true in production to require email verification
enable_confirmations = false

[auth.sms]
enable_signup = false

[analytics]
enabled = false
